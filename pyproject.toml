[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "daymet-mcp"
dynamic = ["version"]
description = "Model Context Protocol (MCP 2026-07-28) server for Daymet V4 R1: daily point data, monthly and annual summaries with explicit aggregation, small-area grids and citations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "daymet-mcp contributors" }]
keywords = ["mcp", "daymet", "climate", "weather", "ornl", "model-context-protocol", "eemt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # MCP 2026-07-28 (stateless core); SDK 2.x low-level Server.
    "mcp>=2.0,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "structlog>=24,<27",
    "anyio>=4,<5",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
# Earthdata (OPeNDAP NetCDF-4) backend and NetCDF output.
grid = ["numpy>=1.26,<3", "h5netcdf>=1.3,<2", "h5py>=3.10,<4"]
docs = ["zensical>=0.0.60,<0.1", "pyyaml>=6,<7"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "hypothesis>=6,<7",
    "jsonschema>=4,<5",
    "ruff>=0.6,<0.16",
    "mypy>=1.10,<2",
    "types-PyYAML>=6,<7",
    "pyproj>=3.6,<4",
]

[project.scripts]
daymet-mcp = "daymet_mcp.__main__:main"

[project.urls]
Documentation = "https://github.com/tyson-swetnam/daymet-mcp/tree/main/docs"
Source = "https://github.com/tyson-swetnam/daymet-mcp"
Changelog = "https://github.com/tyson-swetnam/daymet-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/daymet_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/daymet_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/daymet_mcp", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.uv]
# Hash-pinned lock: uv.lock. Docker installs with `uv sync --frozen`.
required-version = ">=0.5"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "site",
    "docs",
    # vendored from idss-mesa/neon-mcp (itself from UNM-CARC/docs); keep close to upstream
    "scripts/okf_validate.py",
    "scripts/gen_llms_txt.py",
    "scripts/postbuild_agent_surface.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "S105",  # hardcoded-password heuristics fire on constants named *TOKEN*
    "S106",
    "S107",
    "RUF001",  # en dashes / arrows in prose are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "B011", "RUF012"]
"scripts/**" = ["S603", "S607", "S101", "S310"]
"scripts/gen_tools_reference.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "network: talks to the real Daymet/CMR services (opt-in: pytest -m network)",
    "edl: needs DAYMET_MCP_EARTHDATA__TOKEN (combine with network)",
]
addopts = "-ra -m 'not network'"
filterwarnings = ["ignore::DeprecationWarning:hypothesis.*"]

[tool.coverage.run]
source = ["daymet_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional [grid] extra: imported lazily and treated as untyped (numpy's stubs use
# Python 3.12 syntax that mypy rejects under python_version = 3.11).
module = ["h5netcdf", "h5netcdf.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
